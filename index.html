<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIAGA KSR IPS BY FAUZAN (dengan Sound)</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: oklch(0.98 0.01 250);
            --text: oklch(0.20 0.01 250);
            --card: oklch(1 0 0);
            --accent1: oklch(0.65 0.15 150);
            --accent2: oklch(0.60 0.18 300);
            --highlight: oklch(0.9 0.15 85);
            --shadow: oklch(0.5 0.05 250 / 0.2);
        }
        [data-theme="dark"] {
            --bg: oklch(0.15 0.02 260);
            --text: oklch(0.95 0.01 250);
            --card: oklch(0.22 0.02 260);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; transition: 0.3s; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); padding-bottom: 50px; }
        header { text-align: center; padding: 20px; background: var(--card); box-shadow: 0 4px 8px var(--shadow); }
        h1 { font-family: 'Patrick Hand', cursive; font-size: 2.5rem; color: var(--accent2); }
        .controls { margin: 15px 0; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        button { padding: 10px 15px; border: none; border-radius: 8px; background: var(--accent1); color: white; cursor: pointer; font-weight: 600; transform: translateY(0); transition: 0.2s; }
        button:hover { transform: translateY(-3px); box-shadow: 0 5px 10px var(--shadow); background: var(--accent2); }
        .container { max-width: 1000px; margin: auto; padding: 10px 15px; }
        .card { background: var(--card); border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 8px var(--shadow); }
        h2 { color: var(--accent1); border-left: 5px solid var(--accent1); padding-left: 10px; margin-bottom: 15px; }
        .soal { margin-bottom: 30px; border-bottom: 1px dashed var(--shadow); padding-bottom: 15px; }
        .soal-title { font-weight: 700; margin-bottom: 8px; }
        .pilihan label { display: block; margin: 5px 0; cursor: pointer; }
        .pilihan input { margin-right: 8px; }
        .feedback { margin-top: 10px; padding: 10px; border-radius: 5px; display: none; font-weight: 600; }
        .feedback.correct { background: oklch(0.85 0.15 150); color: oklch(0.2 0.05 150); display: block; }
        .feedback.wrong { background: oklch(0.85 0.15 30); color: oklch(0.2 0.05 30); display: block; }
        .tips { background: var(--highlight); padding: 10px; border-radius: 5px; margin-top: 10px; display: none; }
        .tips.show { display: block; }
        .essay { background: var(--highlight); border-radius: 10px; padding: 15px; margin-bottom: 20px; }
        @media (max-width: 600px) { h1 { font-size: 1.8rem; } .container { padding: 5px; } }
    </style>
</head>
<body>
    <header>
        <h1>📚 SIAGA KSR IPS BY FAUZAN</h1>
        <div class="controls">
            <button onclick="toggleDark()">🌓 Gelap/Terang</button>
            <button onclick="resetAll()">🔄 Reset</button>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <h2>📝 Soal Pilihan Ganda (1–43)</h2>
            <div id="soal-area"></div>
        </div>

        <div class="card">
            <h2>📝 Esai</h2>
            <div class="essay"><strong>#38:</strong> Media sosial & konflik... <br><em>Skor 60/100, gunakan A-S-I.</em></div>
            <div class="essay"><strong>#39:</strong> Contoh konflik & integrasi... <br><em>Skor 85/100, tambahkan akomodasi.</em></div>
        </div>
    </div>

    <script>
        // ====== SOUND EFFECT (Web Audio API) ======
        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        function playCorrect() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime); // nada tinggi
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }
        function playWrong() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(220, audioCtx.currentTime); // nada rendah
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        // ====== DATA SOAL (sudah fixed) ======
        const soalPG = [
            {n:1,t:"Sosiologi",s:"Perhatikan data TPT... Masalah sosial paling tepat?",p:["Kualitas lulusan SMK rendah","Pengangguran alamiah","Ketimpangan gender tidak konsisten","Lulusan SMA lebih baik"],k:2,tips:"Baca polanya, jangan berasumsi."},
            {n:2,t:"Sejarah",s:"Penyebab Perang Padri sebelum campur tangan Belanda?",p:["Persaingan ekonomi pedagang","Kebijakan Belanda","Tuntutan otonomi","Pertentangan ideologis Padri vs Adat"],k:3,tips:"Coret opsi yang menyebut Belanda."},
            {n:3,t:"Ekonomi",s:"Kenaikan BBM dampak ke kurva manufaktur?",p:["S kanan, harga turun","S kiri, harga naik, Q turun","D kiri, harga turun","S&D kiri, harga tetap"],k:1,tips:"Biaya naik = S kiri."},
            {n:4,t:"Geografi",s:"Rute termurah antara A-B vs B-C (kontur rapat/renggang)?",p:["A-B stabil","B-C landai","A-B pendek","B-C tinggi"],k:1,tips:"Renggang = landai = murah."},
            {n:5,t:"Geografi",s:"Jalur X (0,5cm) vs Y (2cm), pilih?",p:["X cepat","Y landai","X stabil","Y indah"],k:1,tips:"Landai = hemat energi."},
            {n:6,t:"Sejarah",s:"Organisasi Tiga Serangkai?",p:["Budi Utomo","Sarekat Islam","Indische Partij","Perhimpunan Indonesia"],k:2,tips:"Tiga Serangkai = Indische Partij."},
            {n:7,t:"Sosiologi",s:"Kakek petani -> ayah buruh -> anak dokter = mobilitas?",p:["Horizontal","Vertikal antargenerasi","Vertikal intragenerasi","Vertikal bawah"],k:1,tips:"Beda orang = antar."},
            {n:8,t:"Ekonomi",s:"Andi les privat, biaya peluang?",p:["150k (les)","100k (kafe)","80k (bantu ortu)","330k total"],k:1,tips:"Coret pilihan, ambil cuan tertinggi ditolak."},
            {n:9,t:"Ekonomi",s:"Rina beli sepatu, biaya peluang?",p:["500k (sepatu)","150k (saham)","75k (emas)","10k (bunga)"],k:1,tips:"Keuntungan terbesar ditolak = saham."},
            {n:10,t:"Ekonomi",s:"Rina les privat, biaya peluang?",p:["150k (les)","50k (saham)","150k (emas)","20k (bunga)"],k:2,tips:"Pilih untung terbesar dari yang ditolak."},
            {n:11,t:"Sosiologi",s:"Kebijakan akomodasi terbaik?",p:["BLK gratis","Kuota 50%","Biarkan alam","Usir pendatang"],k:0,tips:"Akomodasi = netral & semua untung."},
            {n:12,t:"Ekonomi",s:"G naik 100, MPC 0,8, ΔY?",p:["100","200","500","1000"],k:2,tips:"Multiplier = 1/MPS = 5, ΔY=5*100=500."},
            {n:13,t:"Ekonomi",s:"MPC 0,75, G=200m, ΔY?",p:["200","400","800","1000"],k:2,tips:"Multiplier 4, ΔY=800."},
            {n:14,t:"Ekonomi",s:"MPC 0,9, G=50m, ΔY?",p:["50","100","250","500"],k:3,tips:"Multiplier 10, ΔY=500."},
            {n:15,t:"Sejarah",s:"Migrasi Out of Taiwan karena?",p:["Serangan Mongol","Laut naik","Tradisi merantau","Perang saudara"],k:1,tips:"Es mencair = laut naik = perahu."},
            {n:16,t:"Ekonomi",s:"Inflasi tinggi, BI lakukan?",p:["Turun bunga, beli SBI","Naik bunga, jual SBI","Turun GWM","Naik bunga, beli SBI"],k:1,tips:"Jual SBI = tarik uang."},
            {n:17,t:"Geografi",s:"Pemisah Peralihan vs Australis?",p:["Wallace","Weber","Khatulistiwa","Lintang Selatan"],k:1,tips:"Weber = Timur."},
            {n:18,t:"Geografi",s:"Burung mirip Australia di Indonesia tengah, zona?",p:["Asiatis","Peralihan","Australis","Timur Weber"],k:1,tips:"Tengah = Peralihan."},
            {n:19,t:"Geografi",s:"Garis Weber memisahkan?",p:["Asiatis vs Peralihan","Peralihan vs Australis","Asiatis vs Australis","Musim"],k:1,tips:"Weber = Timur."},
            {n:20,t:"Geografi",s:"Garis Wallace memisahkan?",p:["Asiatis vs Peralihan","Peralihan vs Australis","Asiatis vs Australis","Antartika"],k:0,tips:"Wallace = Barat."},
            {n:21,t:"Sejarah",s:"Faktor migrasi besar?",p:["Perubahan iklim & invasi","Kuasai perdagangan","Kekeringan","Merantau"],k:0,tips:"Bukan kekeringan."},
            {n:22,t:"Sejarah",s:"Dampak es mencair?",p:["Menetap","Jembatan hilang, perahu","Gurun","Pedagang"],k:1,tips:"Jembatan hilang = migrasi laut."},
            {n:23,t:"Sejarah",s:"Ancaman eksternal Sriwijaya?",p:["Bajak laut","Rakyat berontak","Krisis","Perang saudara"],k:0,tips:"Maritim = bajak laut."},
            {n:24,t:"Ekonomi",s:"PPh Pak Joko 70jt, 5% 50jt pertama, 15% sisanya?",p:["2,5jt","5,5jt","10,5jt","8jt"],k:1,tips:"50jt*5% + 20jt*15% = 5,5jt."},
            {n:25,t:"Sosiologi",s:"Fungsi laten keluarga?",p:["Baca tulis","Kasih sayang","Kontrol sosial","Pewarisan"],k:2,tips:"Laten = efek samping."},
            {n:26,t:"Geografi",s:"Faktor penarik urbanisasi?",p:["Upah rendah","Lapangan kerja","Lahan terbatas","Transmigrasi"],k:1,tips:"Penarik = peluang."},
            {n:27,t:"Sejarah",s:"Peran Indonesia meredakan Perang Dingin?",p:["DK PBB","KAA 1955","Kirim pasukan","Mitra dagang"],k:1,tips:"KAA = Gerakan Non-Blok."},
            {n:28,t:"Ekonomi",s:"Dina pilih saham, biaya peluang?",p:["Bunga 10rb","Sepatu 200rb","Untung saham 40rb","Bunga+sepatu"],k:0,tips:"Ambil paling cuan ditolak."},
            {n:"28b",t:"Ekonomi",s:"Rina pilih nabung, biaya peluang?",p:["Emas 80rb","Bunga 50rb","Tas 500rb","Total 130rb"],k:0,tips:"Emas > bunga."},
            {n:29,t:"Sosiologi",s:"Guru SD jadi kepala sekolah, mobilitas?",p:["Horizontal","Vertikal intra","Vertikal antar","Vertikal bawah"],k:1,tips:"Orang sama = intra."},
            {n:"29b",t:"Sosiologi",s:"PKL jadi pengusaha kaya, mobilitas?",p:["Horizontal","Vertikal intra","Vertikal antar","Vertikal bawah"],k:1,tips:"Dialami sendiri = intra."},
            {n:30,t:"Geografi",s:"Interaksi Jawa-Kalimantan-Sumatera?",p:["Migrasi massal","Ekspor-impor","Perubahan iklim","Kesenjangan"],k:1,tips:"Complementarity = ekspor-impor."},
            {n:31,t:"Geografi",s:"Garis Weber memisahkan?",p:["Asiatis & Peralihan","Peralihan & Australis","Asiatis & Australis","Khatulistiwa"],k:1,tips:"Weber = Timur."},
            {n:32,t:"Geografi",s:"Garis Wallace memisahkan?",p:["Asiatis & Peralihan","Peralihan & Australis","Asiatis & Australis","Antartika"],k:0,tips:"Wallace = Barat."},
            {n:33,t:"Ekonomi",s:"Kebijakan kontraktif?",p:["Turun bunga & beli SBI","Turun GWM","Naik bunga & jual SBI","Naik bunga & beli SBI"],k:2,tips:"Jual = tarik uang."},
            {n:34,t:"Sosiologi",s:"Fungsi laten sekolah?",p:["Ujian","Matematika","Cari teman","Ijazah"],k:2,tips:"Laten = efek samping."},
            {n:"34b",t:"Sosiologi",s:"Fungsi laten agama?",p:["Sholat","Nilai kebaikan","Solidaritas","Hari raya"],k:2,tips:"Solidaritas = laten."},
            {n:35,t:"Sejarah",s:"Es mencair dampak migrasi?",p:["Tutup jalur","Jembatan hilang","Gurun","Pedagang"],k:1,tips:"Jembatan hilang."},
            {n:36,t:"Sejarah",s:"Ekspansi Gajah Mada sukses karena?",p:["Militer modern","Jalur pelayaran","Aliansi","Gerilya"],k:1,tips:"Maritim = pelayaran."},
            {n:37,t:"Sejarah",s:"Tujuan PUTERA?",p:["Pendidikan politik","Tokoh nasionalis & romusha","Latih militer","Kemerdekaan"],k:1,tips:"PUTERA = politik & tenaga."},
            {n:"37b",t:"Sejarah",s:"Tujuan PETA?",p:["Pendidikan politik","Latih pemuda perang","Aspirasi","Tenaga murah"],k:1,tips:"PETA = militer."},
            {n:40,t:"Sejarah",s:"Trilogi Pembangunan?",p:["Stabilitas, Pertumbuhan, Pemerataan","Nasakom","Industri","Swasembada"],k:0,tips:"SPP."},
            {n:"40b",t:"Sejarah",s:"Tujuan REPELITA?",p:["Stabilitas, pertumbuhan, pemerataan","Industri berat","Nasionalisasi","Pasar bebas"],k:0,tips:"REPELITA = alat trilogi."},
            {n:41,t:"Ekonomi",s:"C=100+0,6Y; I=150; G=50. Y?",p:["150","300","600","750"],k:3,tips:"(100+150+50)/0,4=750."},
            {n:42,t:"Ekonomi",s:"C=200+0,8Y; I=100; G=100. Y?",p:["1000","1500","2000","2500"],k:2,tips:"(200+100+100)/0,2=2000."},
            {n:43,t:"Geografi",s:"Interaksi Jawa-Kalimantan-Sumatera (potensi berbeda)?",p:["Migrasi massal","Ekspor-impor","Perubahan iklim","Kesenjangan"],k:1,tips:"Complementarity."}
        ];

        function render() {
            const area = document.getElementById('soal-area');
            let html = '';
            for (let i = 0; i < soalPG.length; i++) {
                const s = soalPG[i];
                html += `<div class="soal" id="soal-${s.n}">
                    <div class="soal-title">${s.n}. [${s.t}] ${s.s}</div>
                    <div class="pilihan">`;
                for (let j = 0; j < s.p.length; j++) {
                    html += `<label><input type="radio" name="soal-${s.n}" value="${j}" onchange="check(${i},${j})"> ${String.fromCharCode(65+j)}. ${s.p[j]}</label>`;
                }
                html += `</div>
                    <div class="feedback" id="fb-${s.n}"></div>
                    <div class="tips" id="tips-${s.n}"></div>
                </div>`;
            }
            area.innerHTML = html;
        }

        function check(index, jawaban) {
            const s = soalPG[index];
            const fb = document.getElementById(`fb-${s.n}`);
            const tips = document.getElementById(`tips-${s.n}`);
            if (jawaban === s.k) {
                fb.innerHTML = '✅ Benar!';
                fb.className = 'feedback correct';
                playCorrect();  // Panggil suara benar
            } else {
                fb.innerHTML = `❌ Salah. Jawaban: ${String.fromCharCode(65+s.k)}.`;
                fb.className = 'feedback wrong';
                playWrong();    // Panggil suara salah
            }
            tips.innerHTML = `💡 Tips: ${s.tips}`;
            tips.classList.add('show');
            const radios = document.getElementsByName(`soal-${s.n}`);
            for (let r of radios) { r.disabled = true; }
        }

        function resetAll() {
            document.querySelectorAll('input[type=radio]').forEach(r => { r.checked = false; r.disabled = false; });
            document.querySelectorAll('.feedback').forEach(f => { f.innerHTML = ''; f.className = 'feedback'; });
            document.querySelectorAll('.tips').forEach(t => { t.innerHTML = ''; t.classList.remove('show'); });
            window.scrollTo(0, 0);
        }

        function toggleDark() {
            const body = document.body;
            body.dataset.theme = body.dataset.theme === 'dark' ? '' : 'dark';
        }

        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>
